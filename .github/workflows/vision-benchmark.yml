name: Ω-VISION Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'TOOLS/**'
      - 'BENCHMARK/**'
      - 'EXPERIMENTS/EXP-VISION-001.md'
      - 'requirements-vision.txt'
      - '.github/workflows/vision-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural gate
        run: python BENCHMARK/vision_runtime_benchmark.py

  real-yolo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install experimental vision stack
        run: python -m pip install --upgrade pip && pip install -r requirements-vision.txt
      - name: Real detector gate
        run: python BENCHMARK/vision_runtime_benchmark.py --real
