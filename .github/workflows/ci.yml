name: B-Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: PYTHONPATH=. python -m pytest -q
      - name: Run structural compression benchmark
        run: PYTHONPATH=. python BENCHMARK/compression_benchmark.py
      - name: Run adaptive lossless archive benchmark
        run: PYTHONPATH=. python BENCHMARK/lossless_archive_benchmark.py
      - name: Run evidence-first recovery benchmark
        run: PYTHONPATH=. python BENCHMARK/recovery_benchmark.py
      - name: Run exact recovery benchmark
        run: PYTHONPATH=. python BENCHMARK/recovery_exact_benchmark.py
      - name: Run recovery damage sweep
        run: PYTHONPATH=. python BENCHMARK/recovery_damage_sweep.py
      - name: Run structural recovery benchmark
        run: PYTHONPATH=. python BENCHMARK/recovery_structure_benchmark.py
      - name: Run Recovery Organ integration benchmark
        run: PYTHONPATH=. python BENCHMARK/recovery_organ_benchmark.py
      - name: Run Audio benchmark
        run: PYTHONPATH=. python BENCHMARK/audio_benchmark.py
      - name: Run STT scoring benchmark
        run: PYTHONPATH=. python BENCHMARK/stt_benchmark.py
      - name: Run graph integrity and cycle benchmark
        run: PYTHONPATH=. python BENCHMARK/graph_integrity_benchmark.py
