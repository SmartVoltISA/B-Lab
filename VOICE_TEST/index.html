<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ω-AUDIO — мини-тест</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif}body{padding:16px 14px 150px}main{max-width:680px;margin:auto}h1{text-align:center;font-size:26px;margin:8px 0 16px}.box{background:#111;border:2px solid #2b2b2b;border-radius:18px;padding:14px;margin:12px 0}.label{font-size:15px;color:#aaa;margin-bottom:7px}.recognized{min-height:92px;font-size:26px;line-height:1.3;display:flex;align-items:center}.response{min-height:110px;font-size:22px;line-height:1.35}.mic{display:block;width:100%;height:150px;border:0;border-radius:28px;background:#1677ff;color:white;font-size:34px;font-weight:900;box-shadow:0 10px 35px #000;cursor:pointer}.mic.listening{background:#d52323;animation:pulse 1s infinite}.mic:disabled{opacity:.45}@keyframes pulse{50%{transform:scale(.985)}}select{width:100%;padding:14px;border-radius:12px;font-size:18px;background:#fff;color:#111}.status{text-align:center;color:#bbb;margin:12px 0;font-size:18px}.hint{text-align:center;color:#888;font-size:15px}.bottom{position:fixed;left:0;right:0;bottom:0;background:#111;border-top:2px solid #333;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -12px 30px #000;z-index:20}.bottomTitle{font-weight:800;font-size:18px}.bottomText{margin-top:4px;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ok{color:#4dff91}.bad{color:#ff5c5c}.clear{width:100%;padding:12px;border-radius:12px;background:#222;color:#fff;border:1px solid #444;font-size:17px}
</style>
</head>
<body>
<main>
<h1>🎙️ Ω-AUDIO</h1>
<div class="box">
<div class="label">ЧТО СИСТЕМА УСЛЫШАЛА</div>
<div id="recognized" class="recognized">—</div>
</div>
<div class="box">
<div class="label">КАК СИСТЕМА ОТРАБОТАЛА</div>
<div id="response" class="response">Нажми кнопку и скажи что-нибудь. Здесь появится результат обработки.</div>
</div>
<div class="box">
<div class="label">ЯЗЫК</div>
<select id="lang">
<option value="ru-RU">🇷🇺 Русский</option>
<option value="kk-KZ">🇰🇿 Қазақша</option>
<option value="en-US">🇬🇧 English</option>
<option value="uk-UA">🇺🇦 Українська</option>
<option value="tr-TR">🇹🇷 Türkçe</option>
<option value="de-DE">🇩🇪 Deutsch</option>
</select>
</div>
<button id="mic" class="mic">🎙️<br>НАЖМИ И ГОВОРИ</button>
<div id="status" class="status">Готов. Жду нажатия.</div>
<p class="hint">Сейчас это контрольный браузерный STT. Потом сюда подключим наш локальный STT.</p>
<div class="box"><button id="clear" class="clear">Очистить</button></div>
</main>
<div class="bottom"><div id="bottomTitle" class="bottomTitle">Результат: —</div><div id="bottomText" class="bottomText">Нажми большую кнопку сверху.</div></div>
<script>
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const mic=document.getElementById('mic'),status=document.getElementById('status'),recognized=document.getElementById('recognized'),response=document.getElementById('response'),lang=document.getElementById('lang'),bottomTitle=document.getElementById('bottomTitle'),bottomText=document.getElementById('bottomText');
let rec=null;
function setBottom(title,text,cls=''){bottomTitle.textContent=title;bottomTitle.className='bottomTitle '+cls;bottomText.textContent=text;}
if(!SR){status.textContent='❌ Браузер не поддерживает голосовой ввод. Открой в Chrome на Android и разреши микрофон.';response.textContent='SpeechRecognition недоступен.';mic.disabled=true;}
else{
rec=new SR();rec.continuous=false;rec.interimResults=true;rec.maxAlternatives=3;
rec.onstart=()=>{mic.classList.add('listening');mic.innerHTML='🔴<br>СЛУШАЮ…';status.textContent='🎙️ Слушаю. Говори сейчас.';setBottom('Слушаю…','Голосовой ввод активен');};
rec.onresult=e=>{let text='';for(let i=e.resultIndex;i<e.results.length;i++)text+=e.results[i][0].transcript;recognized.textContent=text||'…';if(e.results[e.results.length-1].isFinal){response.innerHTML='🟢 Распознавание завершено.<br><span style="color:#aaa">Текст передан дальше без изменения.</span>';status.textContent='Готово.';setBottom('🟢 РАСПОЗНАНО',text,'ok');}};
rec.onerror=e=>{mic.classList.remove('listening');mic.innerHTML='🎙️<br>НАЖМИ И ГОВОРИ';status.textContent='❌ '+e.error;response.textContent='Голосовой ввод завершился ошибкой: '+e.error;setBottom('🔴 ОШИБКА',e.error,'bad');};
rec.onend=()=>{mic.classList.remove('listening');mic.innerHTML='🎙️<br>НАЖМИ И ГОВОРИ';if(status.textContent.startsWith('🎙️'))status.textContent='Готов. Жду следующую фразу.';};
}
mic.onclick=()=>{if(!rec)return;rec.lang=lang.value;recognized.textContent='…';response.textContent='Слушаю и обрабатываю…';status.textContent='Запуск микрофона…';try{rec.start()}catch(e){status.textContent='Подожди окончания предыдущего теста.'}};
document.getElementById('clear').onclick=()=>{recognized.textContent='—';response.textContent='Нажми кнопку и скажи что-нибудь. Здесь появится результат обработки.';status.textContent='Готов. Жду нажатия.';setBottom('Результат: —','Нажми большую кнопку сверху.');};
</script>
</body>
</html>
